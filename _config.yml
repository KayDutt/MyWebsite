# Site settings
title: Little Bits & Pieces
email: kaushik007datta@gmail.com
description: "Love for all things BIG or small"

# If this is a user/organization site (KayDutt.github.io) leave baseurl empty.
# If this is a project site, set baseurl to the repo name, e.g. "/MyWebsite"
baseurl: ""

# Use the real published URL (use https). Update this to your actual Pages URL.
url: "https://kaydutt.github.io"

# GitHub metadata
github_username: KayDutt
repository: KayDutt/MyWebsite

# Theme / remote theme
# Use remote_theme for the Start Bootstrap Clean Blog theme on GitHub Pages.
remote_theme: blackrockdigital/startbootstrap-clean-blog-jekyll

# Build / plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-remote-theme

# Markdown / syntax highlighting
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
highlighter: rouge

# Useful site settings
timezone: "Asia/Kolkata"   # change to your timezone if needed
lang: en
permalink: /:categories/:year/:month/:day/:title/

# Exclude files/dirs from processing to speed up builds
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - README.md

# Defaults for collections
defaults:
  - scope:
      path: "_posts"
    values:
      layout: "post"
      author:
        name: "Kaushik Datta"
        email: "kaushik007datta@gmail.com"

# Optional social / author metadata for templates
author:
  name: "Kaushik Datta"
  email: kaushik007datta@gmail.com
  github: KayDutt
